[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "99blog-cli"
version = "0.1.2"
description = "Publish local Markdown posts to WordPress"
requires-python = ">=3.9"
dependencies = [
  "clc99>=2.3",
  "bleach[css]>=6.4,<7",
  "Markdown>=3.4,<4",
  "pymdown-extensions>=10.20,<11",
  "Pillow>=10.4,<13",
  "PyYAML>=6,<7",
  "python-dotenv>=1,<2",
  "requests>=2.28,<3",
]

[project.scripts]
99blog = "main:main"

[tool.setuptools]
py-modules = ["main", "post", "wordpress", "config", "output", "images", "sanitize"]
